
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #edf1f5;
            margin: 0;
        }

        header {
            background: #17324d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .box {
            background: white;
            width: 380px;
            max-width: 85%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ccc;
        }

        h2 {
            color: #17324d;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2864a8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            color: #b52b2b;
            text-align: center;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Construction Management System</h1>
</header>

<div class="box">

    <h2>Create Account</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Full Name</label>
        <input type="text" name="name"
               placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" name="email"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Minimum 6 characters"
               minlength="6" required>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account?</p>
    <p><a href="{{ url_for('login') }}">Login here</a></p>

</div>

</body>
</html>
