
<!DOCTYPE html>
<html>
<head>
    <title>Make Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #1d3557;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            background: #245da5;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Make Payment</h1>

    <h3>Project: {{ project.title }}</h3>

    <form method="POST"
          action="{{ url_for('pay', project_id=project.id) }}">

        <label>Enter Payment Amount (₹)</label>

        <input type="number"
               name="amount"
               min="1"
               step="0.01"
               placeholder="Enter amount"
               required>

        <label>Select Payment Method</label>

        <select name="method" required>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>

        <button type="submit">
            Submit Payment
        </button>s

    </form>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

    <p style="color: gray;">
        This is a payment record submission.
        No real money will be transferred.
    </p>

</div>

</body>
</html>
